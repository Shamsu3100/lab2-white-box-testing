name: Bug report
description: Report one defect (Lab 1 or Lab 2)
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: test_case
    attributes:
      label: Linked test case
      description: The test case ID from your TESTING.md or WHITEBOX_TESTING.md.
      placeholder: "TC-05"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: How you found this. If you used the web form, give browser and OS. If you found it by tracing code by hand, write "manual trace".
      placeholder: "Chrome 128 on Windows 11, or: manual trace"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, or the trace path through the code.
      placeholder: |
        1. Call check_task(priority=6, hours=5)
        2. Trace D1 (False), D2 (False), D3 (False) ...
    validations:
      required: true

  - type: textarea
    id: test_data
    attributes:
      label: Test data used
      description: The exact input values.
      placeholder: "priority=6, hours=5"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What the specification or business rule says should happen.
      placeholder: "Rejected: priority must be between 1 and 5."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What the code or app actually does.
      placeholder: "(True, \"Valid.\") — priority 6 is accepted."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is the impact if this reaches users?
      options:
        - Critical
        - Major
        - Minor
    validations:
      required: true

  - type: dropdown
    id: priority_field
    attributes:
      label: Priority
      description: How urgently should this be fixed?
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: How often does it happen?
      options:
        - Always
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshot, or your written trace, if not already in Steps.
    validations:
      required: false
